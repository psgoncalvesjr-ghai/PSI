<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Ψ — Perfume e Sabor do Eu</title>
<!-- O MindAR e o three.js sao modulos ES e ficam neste mesmo repositorio,
     nao em servidor de terceiros: o presente nao depende de nada externo
     continuar existindo. O mapa abaixo resolve os nomes que eles importam. -->
<script type="importmap">
{ "imports": {
    "three": "./three.module.js",
    "three/addons/": "./jsm/"
} }
</script>
<style>
  :root{ --roxo:#8B65CE; --fio:#C9C9C9; --tinta:#111; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#fff; color:var(--tinta);
             font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  #palco{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #ar{ position:fixed; inset:0; display:none; }
  #ar.on{ display:block; }
  body.modo-ar #palco{ visibility:hidden; }

  .barra{ position:fixed; left:0; right:0; bottom:0; z-index:10;
          padding:12px 14px calc(12px + env(safe-area-inset-bottom));
          display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap;
          font-size:.78rem; color:#666;
          background:linear-gradient(to top, rgba(255,255,255,.97), rgba(255,255,255,0)); }
  body.modo-ar .barra{ background:linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0)); color:#eee; }
  .ctrl{ display:flex; align-items:center; gap:7px; }
  input[type=range]{ width:min(34vw,150px); accent-color:var(--roxo); }
  button{ background:rgba(255,255,255,.9); color:var(--tinta); border:1px solid #d5d5d5;
          border-radius:9px; padding:8px 14px; font:inherit; font-size:.78rem; cursor:pointer; }
  button.destaque{ background:var(--roxo); color:#fff; border-color:var(--roxo); }
  body.modo-ar button{ background:rgba(255,255,255,.92); }
  .val{ font-variant-numeric:tabular-nums; min-width:3.2em; color:inherit; }
  label{ user-select:none; cursor:pointer; }

  .aviso{ position:fixed; left:50%; top:18px; transform:translateX(-50%); z-index:20;
          background:rgba(17,17,17,.86); color:#fff; padding:10px 16px; border-radius:10px;
          font-size:.8rem; max-width:86vw; text-align:center; display:none; line-height:1.45; }
  .aviso.on{ display:block; }
</style>
</head>
<body>
<canvas id="palco"></canvas>
<div id="ar"></div>
<div class="aviso" id="aviso"></div>

<div class="barra">
  <div class="ctrl"><span>círculos</span>
    <input id="n" type="range" min="1" max="1" value="1"><span class="val" id="nv"></span></div>
  <div class="ctrl"><span>velocidade</span>
    <input id="v" type="range" min="1" max="100" value="34"><span class="val" id="vv"></span></div>
  <div class="ctrl"><label><input id="mostrar" type="checkbox" checked> mecanismo</label></div>
  <div class="ctrl"><button id="zero">reiniciar</button>
    <button id="btnAr" class="destaque">ver sobre o quadro</button></div>
</div>

-687, 1e-07, 1.088662], [-698, 1e-07, -1.961927], [-264, 1e-07, -0.667323], [685, 1e-07, 2.258976], [-608, 1e-07, -0.094508], [720, 1e-07, 2.642212], [-701, 1e-07, -2.763066], [349, 1e-07, -0.488396], [712, 1e-07, 0.990603], [-392, 1e-07, 1.466016], [542, 1e-07, 1.132017], [-643, 1e-07, -1.914604], [-444, 1e-07, -1.37835], [522, 1e-07, 1.016492], [-656, 1e-07, -1.344386], [-464, 1e-07, -1.196969], [534, 1e-07, -1.166963], [-706, 1e-07, -0.216738], [530, 1e-07, -1.239552], [-423, 0.0, 0.200115], [-714, 0.0, -2.771541]];            // [frequencia, raio, fase]
const ALVO  = {"pagina_larg": 297.0, "pagina_alt": 420.0, "x0": 0.1919, "x1": 0.8081, "y0": 0.24214, "y1": 0.6506, "cx": 0.5, "cy": 0.44637, "altura": 0.40847, "folga": 0.035};             // geometria da letra dentro da pagina

const el = id => document.getElementById(id);
const cv = el('palco'), ctx = cv.getContext('2d');
const sN = el('n'), sV = el('v'), chk = el('mostrar'), aviso = el('aviso');
sN.max = COEFS.length; sN.value = COEFS.length;

let t = 0, traco = [], rodando = true, ultimo = 0, modoAr = false;

// ---------------------------------------------------------------- desenho ---
function calcula(n){
  let x = 0, y = 0;
  const pts = new Float64Array(2 * (n + 1));
  for (let i = 0; i < n; i++){
    const c = COEFS[i], ang = 2 * Math.PI * c[0] * t + c[2];
    x += c[1] * Math.cos(ang);
    y -= c[1] * Math.sin(ang);            // tela tem y para baixo
    pts[2*i+2] = x; pts[2*i+3] = y;
  }
  return pts;
}

function pinta(g, larg, alt, cx, cy, esc, fundo){
  const n = +sN.value, ver = chk.checked;
  // com cor, pinta o fundo; sem cor, quem chamou ja preparou a tela
  // (no modo sobre o quadro isso importa: o branco que apaga a letra
  //  impressa e desenhado antes e nao pode ser limpo aqui)
  if (fundo){ g.fillStyle = fundo; g.fillRect(0, 0, larg, alt); }

  const pts = calcula(n);
  const px = i => cx + pts[2*i] * esc, py = i => cy + pts[2*i+1] * esc;

  if (ver){
    g.strokeStyle = '#C9C9C9'; g.lineWidth = Math.max(1, esc * 0.0016);
    g.beginPath();
    for (let i = 0; i < n; i++){
      const r = COEFS[i][1] * esc;
      if (r < 1.2) break;                 // ja vem do maior para o menor
      g.moveTo(px(i) + r, py(i));
      g.arc(px(i), py(i), r, 0, 2 * Math.PI);
    }
    g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.26)';
    g.beginPath(); g.moveTo(px(0), py(0));
    for (let i = 1; i <= n; i++) g.lineTo(px(i), py(i));
    g.stroke();
  }

  traco.push(pts[2*n], pts[2*n+1]);
  if (traco.length > 26000) traco.splice(0, 2);

  g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--roxo').trim();
  g.lineWidth = Math.max(2, esc * 0.011);
  g.lineJoin = g.lineCap = 'round';
  g.beginPath();
  for (let i = 0; i < traco.length; i += 2){
    const X = cx + traco[i] * esc, Y = cy + traco[i+1] * esc;
    i ? g.lineTo(X, Y) : g.moveTo(X, Y);
  }
  g.stroke();

  if (ver){
    g.fillStyle = '#111';
    g.beginPath(); g.arc(px(n), py(n), Math.max(2.5, esc*0.004), 0, 2*Math.PI); g.fill();
  }
}

// ------------------------------------------------------------ modo 1: tela ---
let W, H, CX, CY, ESC;
function medir(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  CX = W / 2; CY = H / 2 - Math.min(H * 0.05, 30);
  ESC = Math.min(W * 0.80, H * 0.60) / 1.37;
  traco.length = 0;
}
addEventListener('resize', medir);

// -------------------------------------------------- modo 2: sobre o quadro ---
// Uma tela auxiliar reproduz a pagina inteira: um retangulo branco apaga so a
// area da letra impressa, e a animacao e desenhada exatamente naquele lugar.
const cvAr = document.createElement('canvas');
cvAr.width = 1024; cvAr.height = Math.round(1024 * ALVO.pagina_alt / ALVO.pagina_larg);
const gAr = cvAr.getContext('2d');

function pintaAr(){
  const L = cvAr.width, A = cvAr.height;
  gAr.clearRect(0, 0, L, A);
  const m = ALVO.folga * L;
  gAr.fillStyle = '#fff';
  gAr.fillRect(ALVO.x0 * L - m, ALVO.y0 * A - m,
               (ALVO.x1 - ALVO.x0) * L + 2*m, (ALVO.y1 - ALVO.y0) * A + 2*m);
  pinta(gAr, L, A, ALVO.cx * L, ALVO.cy * A, ALVO.altura * A / 1.0, null);
}

async function ligaAr(){
  aviso.textContent = 'preparando a câmera…'; aviso.classList.add('on');
  try{
    // ambos sao modulos ES; carregar como <script> comum nao funciona
    const THREE = await import('three');
    const { MindARThree } = await import('./mindar-image-three.prod.js');

    // O container PRECISA estar visivel antes de iniciar: o MindAR mede o
    // espaco disponivel para dimensionar o video e a cena. Escondido, ele
    // mede zero — a camera liga e a imagem nao aparece em lugar nenhum.
    el('ar').classList.add('on');
    document.body.classList.add('modo-ar');
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    const mind = new MindARThree({
      container: el('ar'), imageTargetSrc: './alvo.mind',
      uiScanning: 'no', uiLoading: 'no', uiError: 'no',
    });
    const { renderer, scene, camera } = mind;
    const ancora = mind.addAnchor(0);
    const tex = new THREE.CanvasTexture(cvAr);
    tex.colorSpace = THREE.SRGBColorSpace;
    const plano = new THREE.Mesh(
      new THREE.PlaneGeometry(1, ALVO.pagina_alt / ALVO.pagina_larg),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    ancora.group.add(plano);

    let visto = false;
    ancora.onTargetFound = () => { visto = true; aviso.classList.remove('on'); };
    ancora.onTargetLost  = () => { aviso.textContent = 'aponte para o quadro'; aviso.classList.add('on'); };

    await mind.start();

    // no iOS o video so aparece embutido na pagina com playsinline
    const v = el('ar').querySelector('video');
    if (v){ v.setAttribute('playsinline', ''); v.setAttribute('muted', ''); v.muted = true;
            v.play().catch(() => {}); }

    modoAr = true; el('btnAr').textContent = 'voltar';
    aviso.textContent = 'aponte para o quadro';
    renderer.setAnimationLoop(() => { tex.needsUpdate = true; renderer.render(scene, camera); });

    setTimeout(() => {
      if (visto) return;
      const c = el('ar');
      aviso.innerHTML = 'não estou reconhecendo o quadro.<br>'
        + 'mais luz, sem reflexo, e o quadro inteiro no enquadramento.'
        + '<br><small style="opacity:.7">vídeo ' + (v ? v.videoWidth + '×' + v.videoHeight : 'ausente')
        + ' · área ' + c.clientWidth + '×' + c.clientHeight + '</small>';
      aviso.classList.add('on');
    }, 12000);
  }catch(e){
    const faltaAlvo = /alvo\.mind|404|fetch/i.test(String(e && (e.message || e)));
    aviso.textContent = faltaAlvo
      ? 'o reconhecimento do quadro ainda não foi publicado. A animação continua na tela.'
      : 'não consegui abrir a câmera. A animação continua na tela.';
    setTimeout(() => aviso.classList.remove('on'), 5000);
    console.error(e);
  }
}

// ------------------------------------------------------------------- laco ---
function laco(agora){
  const dt = ultimo ? Math.min((agora - ultimo) / 1000, 0.05) : 0;
  ultimo = agora;
  if (modoAr) pintaAr();
  else pinta(ctx, W, H, CX, CY, ESC, '#fff');
  if (rodando){ t += dt * (+sV.value / 100) * 0.22; if (t >= 1) t -= 1; }
  requestAnimationFrame(laco);
}

function sincroniza(){ el('nv').textContent = sN.value; el('vv').textContent = sV.value; }
[sN, sV].forEach(s => s.addEventListener('input', () => {
  sincroniza(); if (s === sN) traco.length = 0;
}));
el('zero').onclick = () => { t = 0; traco.length = 0; };
el('btnAr').onclick = () => {
  if (!modoAr) ligaAr();
  else location.reload();
};

medir(); sincroniza(); requestAnimationFrame(laco);
</script>
